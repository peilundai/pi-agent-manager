version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # Major upgrades of these need a deliberate migration.
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/vscode"
      # typescript-eslint (type-aware lint) supports TypeScript < 6.1 only; revisit
      # TypeScript 7 once typescript-eslint supports it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Types track the Node runtime of the VS Code extension host (Node 22).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
